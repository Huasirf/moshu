<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨枢 MoShu — AI 小说创作 IDE</title>
  </head>
  <body style="margin: 0;">
    <!-- 同步读取主题，避免加载页与主界面背景色闪跳（独立文件：生产构建的 CSP 不允许内联脚本） -->
    <script src="./theme-boot.js"></script>
    <div id="root">
      <style>
        .moshu-initial-loader {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: var(--loader-bg, #0A1628);
          font-family: "Noto Serif SC", "Songti SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          user-select: none;
        }

        /* 墨色圆环 + 中枢光点：以「枢」为意象的开屏标识 */
        .moshu-core-container {
          position: relative;
          width: 88px;
          height: 88px;
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 22px;
        }

        .moshu-ring {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: rgba(201, 167, 108, 0.85);
          border-bottom-color: rgba(126, 200, 227, 0.75);
          animation: moshu-spin 2.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .moshu-ring-inner {
          position: absolute;
          width: 66%;
          height: 66%;
          border-radius: 50%;
          border: 2px solid transparent;
          border-left-color: rgba(201, 167, 108, 0.75);
          border-right-color: rgba(155, 142, 200, 0.75);
          animation: moshu-spin-reverse 3s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .moshu-core {
          width: 16px;
          height: 16px;
          background: radial-gradient(circle at 35% 35%, #F2E2B8, #C9A76C 55%, #8C6B3F);
          border-radius: 50%;
          box-shadow: 0 0 18px rgba(201, 167, 108, 0.65), 0 0 42px rgba(201, 167, 108, 0.35);
          animation: moshu-pulse 2.2s ease-in-out infinite;
        }

        .moshu-title {
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 6px;
          background: linear-gradient(100deg, #C9A76C, #F2E2B8, #C9A76C);
          background-size: 200% auto;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          animation: moshu-text-shine 3.2s linear infinite;
        }

        .moshu-subtitle {
          margin-top: 10px;
          font-size: 11px;
          letter-spacing: 4px;
          text-transform: uppercase;
          color: rgba(126, 200, 227, 0.55);
        }

        @keyframes moshu-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes moshu-spin-reverse {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }

        @keyframes moshu-pulse {
          0%, 100% { transform: scale(0.82); opacity: 0.85; box-shadow: 0 0 14px rgba(201, 167, 108, 0.45); }
          50% { transform: scale(1.28); opacity: 1; box-shadow: 0 0 30px rgba(201, 167, 108, 0.9), 0 0 56px rgba(201, 167, 108, 0.45); }
        }

        @keyframes moshu-text-shine {
          to { background-position: 200% center; }
        }
      </style>
      <div class="moshu-initial-loader">
        <div class="moshu-core-container">
          <div class="moshu-ring"></div>
          <div class="moshu-ring-inner"></div>
          <div class="moshu-core"></div>
        </div>
        <div class="moshu-title">墨枢</div>
        <div class="moshu-subtitle">MoShu · AI Novel IDE</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
